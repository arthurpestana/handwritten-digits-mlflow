experiment: a1-digits-mlp
run_name: C_l2
description: >
  Run C: altera somente train.weight_decay (0 -> 1e-5) em relação à A.
  Equivale ao mlp_torch_regularizacao_L2.py da disciplina.
  Pergunta: L2 reduz o gap entre train_loss e val_loss sem derrubar a val_acc?
tags:
  changed_param: train.weight_decay
  hypothesis: L2 penaliza pesos grandes e reduz o overfitting observado na A

seed: 42
data:
  val_size: 0.15
  test_size: 0.15
  leak_scaler: false
model:
  hidden: [128, 64]
  dropout: 0.0
train:
  epochs: 100
  batch_size: 64
  lr: 0.01
  # use 1.0e-5: o PyYAML lê "1e-5" como string
  weight_decay: 1.0e-5
